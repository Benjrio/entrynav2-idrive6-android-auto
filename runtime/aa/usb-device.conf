# Which phone hu-aa.elf may use. One directive; '#' starts a comment. See README_EN.md.
#   any                 any Android Auto phone on any USB port, when exactly one candidate is plugged in
#   port 1-1 [2-1 ...]  any Android Auto phone, only on these USB ports (head unit sysfs paths)
#   <port> <VID> <PID>  one specific phone on one port (original format)
#   auto                only a device already in AOA accessory mode (original format)
# Check what would be picked, read-only, on the head unit:  sh run-hu.sh usb-scan <kit>
any
